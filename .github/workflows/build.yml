name: Build Arduino library

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arduino-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # A merge produces a push to the default branch, regardless of its name.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    name: Arduino ESP32 ${{ matrix.core }}
    strategy:
      fail-fast: false
      matrix:
        core: ['3.3.11', '3.3.10']
    runs-on: windows-2022
    env:
      CORE_VERSION: ${{ matrix.core }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.2.2'
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          arduino-cli config set directories.data "$env:LOCALAPPDATA/Arduino15"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          arduino-cli core install "esp32:esp32@$env:CORE_VERSION" --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Fetch pinned dependencies
        run: python tools/fetch_sources.py --core-version $env:CORE_VERSION
      - name: Build ESP32 archive
        run: python tools/build_archives.py --target esp32 --core-version $env:CORE_VERSION
      - name: Build ESP32-S3 archive
        run: python tools/build_archives.py --target esp32s3 --core-version $env:CORE_VERSION
      - name: Check archive symbols and byte order
        run: python tests/archives.py --core-version $env:CORE_VERSION
      - name: Stage version-specific library
        run: python tools/prepare_library.py --core-version $env:CORE_VERSION
      - name: Test build configuration safeguards
        run: python -m unittest discover -s tests -p test_build_config.py
      - name: Test browser viewer
        run: node tests/viewer.test.cjs
      - name: Compile all Doorbell profiles and HardwareCheck
        run: python tools/compile_matrix.py --core-version $env:CORE_VERSION
      - name: Install PlatformIO
        if: matrix.core == '3.3.11'
        run: python -m pip install platformio==6.2.0
      - name: Compile PlatformIO ESP32 and ESP32-S3 examples
        if: matrix.core == '3.3.11'
        run: python -m platformio run --project-dir build/arduino-3.3.11/SinricProWebRTC/examples/PlatformIO -e esp32cam -e xiao_s3_sense
      - name: Package Arduino library
        run: python tools/package.py --core-version $env:CORE_VERSION
      - name: Upload installable library
        uses: actions/upload-artifact@v4
        with:
          name: SinricProWebRTC-arduino-${{ matrix.core }}-${{ github.sha }}
          path: dist/*-arduino-${{ matrix.core }}.zip
          if-no-files-found: error
      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-logs-arduino-${{ matrix.core }}-${{ github.sha }}
          path: build/arduino-${{ matrix.core }}/compile/*.log
          if-no-files-found: ignore
