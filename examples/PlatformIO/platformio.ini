[platformio]
default_envs = esp32cam

[env]
; This pioarduino release supplies Arduino ESP32 3.3.11 / IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
lib_ldf_mode = chain
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps = symlink://../..

[env:esp32cam]
board = esp32cam
build_flags =
    -DBOARD_HAS_PSRAM
    -DDOORBELL_BOARD=6

[env:xiao_s3_sense]
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DDOORBELL_BOARD=2

[env:lilygo_camera]
board = esp32dev
build_flags =
    -DBOARD_HAS_PSRAM
    -DDOORBELL_BOARD=10
